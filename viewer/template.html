<title>{{TITRE}}</title>
<meta name="description" content="Vue 3D interactive d'une pièce conçue pour la Bambu Lab H2D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Plan de travail : scène 3D plein cadre + fiche technique latérale (empilée sur mobile). */
  :root {
    --bg: #e9edf0;
    --panel: #f8fafb;
    --fg: #1a2329;
    --muted: #5a6872;
    --line: #cfd7dd;
    --accent: #0a6a94;
    --ok: #1f7a4d;
    --warn: #b3261e;
    --plate: #c9d2d9;
    --grid: #b3bec7;
    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11171b; --panel: #172026; --fg: #e2e8ec; --muted: #93a2ad; --line: #28343c;
      --accent: #53b4e0; --ok: #5cc28f; --warn: #f2867c; --plate: #1e2a31; --grid: #2e3d46;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11171b; --panel: #172026; --fg: #e2e8ec; --muted: #93a2ad; --line: #28343c;
    --accent: #53b4e0; --ok: #5cc28f; --warn: #f2867c; --plate: #1e2a31; --grid: #2e3d46;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
  }
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
  }
  .stage { position: relative; min-width: 0; min-height: 0; }
  #scene { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  .toolbar {
    position: absolute;
    left: 16px; right: 16px; bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 6px;
    pointer-events: none;
  }
  .toolbar button {
    pointer-events: auto;
    font: 500 13px/1 var(--font-body);
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 12px;
    cursor: pointer;
  }
  .toolbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .toolbar .sep { width: 8px; }
  .toolbar input[type="color"] {
    pointer-events: auto;
    width: 38px; height: 34px; padding: 2px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .status {
    position: absolute; top: 16px; left: 16px; right: 16px;
    font: 400 12px/1.4 var(--font-data);
    color: var(--muted);
    pointer-events: none;
  }

  .sheet {
    min-width: 0;
    overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding-block: 20px 28px;
    padding-inline: 20px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .eyebrow {
    font: 500 11px/1 var(--font-data);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 6px 0 0;
    font: 600 26px/1.1 var(--font-display);
    text-wrap: balance;
  }
  h2 {
    margin: 0 0 10px;
    font: 600 15px/1.2 var(--font-display);
    letter-spacing: 0.02em;
  }
  .fit {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px;
    font: 500 12px/1 var(--font-data);
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid currentColor;
  }
  .fit.ok { color: var(--ok); }
  .fit.warn { color: var(--warn); }
  .fit.ref { color: var(--muted); }
  .source { margin: 0; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .source a { color: var(--accent); }

  .parts { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .part { display: grid; grid-template-columns: 12px minmax(0, 1fr); column-gap: 10px; row-gap: 2px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; margin-top: 3px; }
  .part-name { font-weight: 500; }
  .part-dims, .part-vol { grid-column: 2; font: 400 12.5px/1.4 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
  .part-dims strong { color: var(--fg); font-weight: 500; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
  th { font: 400 12px/1.3 var(--font-data); color: var(--muted); word-break: break-word; padding-right: 8px; }
  td { font: 500 13px/1.3 var(--font-data); text-align: right; white-space: nowrap; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
    html, body { height: auto; }
    .stage { height: 62vh; }
    .sheet { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <div class="stage">
    <canvas id="scene" aria-label="Vue 3D de la pièce : glisser pour tourner, pincer ou molette pour zoomer"></canvas>
    <div class="status" id="status">Chargement de la vue 3D…</div>
    <div class="toolbar" role="toolbar" aria-label="Vues">
      <button type="button" id="v-iso" data-view="iso">Iso</button>
      <button type="button" id="v-top" data-view="top">Dessus</button>
      <button type="button" id="v-front" data-view="front">Face</button>
      <button type="button" id="v-side" data-view="side">Côté</button>
      <button type="button" id="v-rear" data-view="rear">Arrière</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="t-edges" aria-pressed="true">Arêtes</button>
      <button type="button" id="t-plate" aria-pressed="true">Plateau H2D</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="t-rendu" aria-pressed="false">Rendu</button>
      <input type="color" id="c-rendu" value="#1c1d1f" aria-label="Couleur du filament" hidden>
    </div>
  </div>

  <aside class="sheet">
    <header>
      <div class="eyebrow">Bambu Lab H2D · vue d'impression</div>
      <h1 id="titre">{{TITRE}}</h1>
      <div id="fit" class="fit ok">—</div>
    </header>

    <section>
      <h2>Pièces</h2>
      <ul class="parts" id="parts"></ul>
    </section>

    <section id="params-section">
      <h2>Paramètres (mm)</h2>
      <table><tbody id="params"></tbody></table>
      <p class="hint">Pour modifier : demander à Claude, par ex. « passe JEU à 0,3 ».</p>
    </section>

    <section id="source-section" hidden>
      <h2>Source</h2>
      <p class="source" id="source"></p>
    </section>
  </aside>
</div>

<script type="application/json" id="donnees">/*__DONNEES__*/</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const data = JSON.parse(document.getElementById("donnees").textContent);
const fmt = (v, d = 2) => Number(v).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const $ = (id) => document.getElementById(id);

// ---- Fiche technique
const allFit = data.pieces.every((p) => p.contexte || p.tient_dans_h2d);
const [vx, vy, vz] = data.volume_h2d_mm;
if (data.reference) {
  $("fit").className = "fit ref";
  $("fit").textContent = "Modèle de référence · non imprimé";
} else {
  $("fit").className = "fit " + (allFit ? "ok" : "warn");
  $("fit").textContent = (allFit ? "Tient dans " : "Dépasse ") + `${vx} × ${vy} × ${vz} mm`;
}
if (data.source) {
  $("source-section").hidden = false;
  const src = $("source");
  for (const part of data.source.split(/(https:\/\/\S+)/)) {
    if (/^https:\/\//.test(part)) {
      const a = document.createElement("a");
      a.href = part; a.textContent = part; a.target = "_blank"; a.rel = "noopener";
      src.append(a);
    } else src.append(part);
  }
}
if (!Object.keys(data.parametres).length) $("params-section").hidden = true;

for (const p of data.pieces) {
  const li = document.createElement("li");
  li.className = "part";
  const [x, y, z] = p.dimensions_mm;
  li.innerHTML = `<span class="swatch" style="background:${p.couleur}"></span>
    <span class="part-name"></span>
    <span class="part-dims"><strong>${fmt(x)}</strong> × <strong>${fmt(y)}</strong> × <strong>${fmt(z)}</strong> mm</span>
    <span class="part-vol">${p.contexte ? "contexte, non imprimé" : fmt(p.volume_cm3) + " cm³"}${p.tient_dans_h2d || data.reference ? "" : " · hors volume H2D"}</span>`;
  li.querySelector(".part-name").textContent = p.nom;
  $("parts").append(li);
}
for (const [k, v] of Object.entries(data.parametres)) {
  const tr = document.createElement("tr");
  const th = document.createElement("th");
  const td = document.createElement("td");
  th.textContent = k;
  td.textContent = fmt(v, Number.isInteger(v) ? 0 : (String(v).split(".")[1] || "").length);
  tr.append(th, td);
  $("params").append(tr);
}

// ---- Scène
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8894a0, 1.6);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1, -1.4, 2);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.6);
rim.position.set(-1.2, 1, 0.6);
scene.add(rim);

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const models = new THREE.Group();
const edges = new THREE.Group();
scene.add(models, edges);

const loader = new STLLoader();
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)).buffer;
// Mode Rendu : une seule matière pour les pièces imprimées (PETG mat), verre noir pour le contexte
const matFilament = new THREE.MeshPhysicalMaterial({ color: data.couleur_rendu || "#1c1d1f", roughness: 0.6,
  metalness: 0, clearcoat: 0.15, clearcoatRoughness: 0.5 });
const matContexte = new THREE.MeshPhysicalMaterial({ color: 0x0b0c0e, roughness: 0.12, metalness: 0,
  clearcoat: 1, clearcoatRoughness: 0.05 });
for (const p of data.pieces) {
  let geo = loader.parse(b64(data.stl[p.stl]));
  geo = toCreasedNormals(geo, THREE.MathUtils.degToRad(30));
  const mat = new THREE.MeshStandardMaterial({ color: p.couleur, roughness: 0.62, metalness: 0,
    transparent: !!p.contexte, opacity: p.contexte ? 0.35 : 1, depthWrite: !p.contexte });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { debug: mat, rendu: p.contexte ? matContexte : matFilament };
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  models.add(mesh);
  const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({ transparent: true, opacity: 0.55 }));
  edges.add(line);
}

// Plateau H2D (325 × 320 mm, grille 10 mm) centré sous les pièces.
const box = new THREE.Box3().setFromObject(models);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const plate = new THREE.Group();
const plateMesh = new THREE.Mesh(new THREE.PlaneGeometry(vx, vy), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.9 }));
plateMesh.position.z = -0.05;
const gridPts = [];
for (let x = -vx / 2; x <= vx / 2 + 1e-6; x += 10) gridPts.push(x, -vy / 2, 0, x, vy / 2, 0);
for (let y = -vy / 2; y <= vy / 2 + 1e-6; y += 10) gridPts.push(-vx / 2, y, 0, vx / 2, y, 0);
const gridGeo = new THREE.BufferGeometry();
gridGeo.setAttribute("position", new THREE.Float32BufferAttribute(gridPts, 3));
const grid = new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial());
plate.add(plateMesh, grid);
plate.position.set(center.x, center.y, 0);
scene.add(plate);

function applyTheme() {
  scene.background = new THREE.Color(css("--bg"));
  plateMesh.material.color.set(css("--plate"));
  grid.material.color.set(css("--grid"));
  for (const l of edges.children) l.material.color.set(css("--fg"));
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---- Vues
const radius = Math.max(size.length() * 0.5, 10);
const dirs = {
  iso: new THREE.Vector3(1, -1.25, 0.9),
  top: new THREE.Vector3(0, -0.0001, 1),
  front: new THREE.Vector3(0, -1, 0.0001),
  side: new THREE.Vector3(1, 0, 0.0001),
  rear: new THREE.Vector3(-1, 1.25, 0.9),
};
function setView(name, marge = 1.08) {
  const d = dirs[name].clone().normalize();
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const dist = radius / Math.sin(Math.min(vHalf, hHalf)) * marge;
  controls.target.copy(center);
  camera.position.copy(center).addScaledVector(d, dist);
  camera.near = dist / 100;
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  controls.update();
}
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
function toggle(btn, obj) {
  btn.addEventListener("click", () => {
    obj.visible = !obj.visible;
    btn.setAttribute("aria-pressed", String(obj.visible));
  });
}
toggle($("t-edges"), edges);
toggle($("t-plate"), plate);

// ---- Mode Rendu : éclairage studio, ombres douces, matière unique
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const sol = new THREE.Mesh(new THREE.PlaneGeometry(radius * 12, radius * 12), new THREE.ShadowMaterial({ opacity: 0.22 }));
sol.position.set(center.x, center.y, box.min.z - 0.01);
sol.receiveShadow = true;
sol.visible = false;
scene.add(sol);
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 6;
const ombre = key.shadow.camera;
ombre.left = ombre.bottom = -radius * 1.6;
ombre.right = ombre.top = radius * 1.6;
ombre.near = 1;
ombre.far = radius * 8;
key.target.position.copy(center);
scene.add(key.target);

let modeRendu = false;
function setRendu(on) {
  modeRendu = on;
  for (const m of models.children) m.material = on ? m.userData.rendu : m.userData.debug;
  edges.visible = !on;
  plate.visible = !on;
  sol.visible = on;
  scene.environment = on ? envTex : null;
  renderer.toneMapping = on ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  hemi.intensity = on ? 0.35 : 1.6;
  key.intensity = on ? 2.2 : 1.6;
  rim.intensity = on ? 0.4 : 0.6;
  key.position.copy(center).add(new THREE.Vector3(radius * 1.2, -radius * 1.6, radius * 2.6));
  key.castShadow = on;
  $("t-rendu").setAttribute("aria-pressed", String(on));
  $("t-edges").setAttribute("aria-pressed", String(edges.visible));
  $("t-plate").setAttribute("aria-pressed", String(plate.visible));
  $("c-rendu").hidden = !on;
}
function setCouleur(hex) {
  matFilament.color.set(hex);
  $("c-rendu").value = hex;
}
$("t-rendu").addEventListener("click", () => setRendu(!modeRendu));
$("c-rendu").addEventListener("input", (e) => setCouleur(e.target.value));
if (data.couleur_rendu) $("c-rendu").value = data.couleur_rendu;

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();
setView("iso");

$("status").textContent = `Ensemble ${fmt(size.x, 1)} × ${fmt(size.y, 1)} × ${fmt(size.z, 1)} mm · glisser pour tourner, pincer pour zoomer`;
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// Crochet d'automatisation (tools/render.py)
window.vue3d = { vue: setView, rendu: setRendu, couleur: setCouleur, pret: true };
</script>
